<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Question importante</title>
  <style>
    :root { --pink:#e91e63; --bg1:#ffd6e7; --bg2:#f7e8ff; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      padding: 20px;
    }
    .card{
      width:min(520px, 92vw);
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      text-align:center;
      position: relative;
    }
    .icon{
      width: 72px; height:72px; margin: 0 auto 10px;
      border-radius: 50%;
      display:grid; place-items:center;
      background: rgba(233,30,99,0.12);
      font-size: 34px;
    }
    h1{ font-size: 22px; margin: 8px 0 6px; font-weight: 750; }
    p{ margin: 0 0 12px; color: rgba(0,0,0,0.65); }
    .btn-area{
      position: relative;
      width: min(420px, 88vw);
      height: 140px;
      margin: 14px auto 0;
    }
    button{
      border:0; cursor:pointer;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
      transition: transform 120ms ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #yes{
      background: var(--pink);
      color:white;
      position:absolute;
      left: 10px;
      top: 48px;
      transform-origin: left center;
    }
    #no{
      background: #e9e9e9;
      color: #222;
      position:absolute;
      right: 10px;
      top: 48px;
    }
    .hint{ margin-top: 10px; font-size: 12px; color: rgba(0,0,0,0.45); }

    /* écran final */
    .result{
      display:none;
      margin-top: 10px;
    }
    .result h2{ margin: 6px 0 10px; }
    .result img{
      width: min(360px, 86vw);
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 14px 40px rgba(0,0,0,0.14);
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">💘</div>
    <h1><span id="name">Nirali</span>, tu veux être ma valentine ?</h1>
    <p id="sub">Réponds honnêtement (mais choisis bien 😄).</p>

    <div class="btn-area" id="arena">
      <button id="yes">Yes</button>
      <button id="no" aria-label="No">No</button>
    </div>

    <div class="hint" id="hint">Astuce : le “No” est… capricieux.</div>

    <div class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img id="pic" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="Yay">
      <div class="hint">Tu peux remplacer l’image/GIF par une photo à vous 🙂</div>
    </div>
  </div>

  <script>
    // Personnalisation rapide
    const PERSON_NAME = "Nirali"; // ← change ici
    document.getElementById("name").textContent = PERSON_NAME;

    const arena = document.getElementById("arena");
    const noBtn  = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const sub    = document.getElementById("sub");
    const result = document.getElementById("result");

    let tries = 0;

    function moveNo() {
      const pad = 10;

      // dimensions utiles
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const maxX = a.width  - b.width  - pad;
      const maxY = a.height - b.height - pad;

      const x = Math.max(pad, Math.floor(Math.random() * maxX));
      const y = Math.max(pad, Math.floor(Math.random() * maxY));

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
      noBtn.style.right = "auto";
    }

    function growYes() {
      const scale = 1 + Math.min(tries, 10) * 0.08; // plafonne pour éviter l’abus
      yesBtn.style.transform = `scale(${scale})`;
    }

    // Empêche le clic sur mobile + effet "fuite"
    ["mouseenter","mouseover","touchstart","pointerdown"].forEach(evt => {
      noBtn.addEventListener(evt, (e) => {
        e.preventDefault();
        tries++;
        moveNo();
        growYes();
        if (tries === 2) sub.textContent = "Allez… réfléchis 😇";
        if (tries === 4) sub.textContent = "C’est toujours “Yes” la bonne réponse.";
        if (tries === 7) sub.textContent = "Ok, je rends le bouton Yes encore plus facile.";
      }, { passive: false });
    });

    // Si jamais il arrive à cliquer “No” (rare), on le fait quand même fuir
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      tries++;
      moveNo();
      growYes();
    });

    yesBtn.addEventListener("click", () => {
      // Cache les boutons, affiche le résultat
      arena.style.display = "none";
      document.getElementById("hint").style.display = "none";
      sub.textContent = "";
      result.style.display = "block";
    });

    // Place initiale du "No" (utile si l’écran est petit)
    window.addEventListener("load", () => moveNo());
    window.addEventListener("resize", () => moveNo());
  </script>
</body>
</html>
