<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Question importante</title>
  <style>
    :root { --pink:#e91e63; --bg1:#ffd6e7; --bg2:#f7e8ff; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      padding: 20px;
    }
    .card{
      width:min(520px, 92vw);
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      text-align:center;
      position: relative;
    }
    .icon{
      width: 72px; height:72px; margin: 0 auto 10px;
      border-radius: 50%;
      display:grid; place-items:center;
      background: rgba(233,30,99,0.12);
      font-size: 34px;
    }
    h1{ font-size: 22px; margin: 8px 0 6px; font-weight: 750; }
    p{ margin: 0 0 12px; color: rgba(0,0,0,0.65); }
    .btn-area{
      position: relative;
      width: min(420px, 88vw);
      height: 190px;
      margin: 14px auto 0;
    }
    button{
      border:0; cursor:pointer;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
      transition: transform 120ms ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #yes{
      background: var(--pink);
      color:white;
      position:absolute;
      left: 10px;
      top: 48px;
      transform-origin: left center;
    }
    #no{
      background: #e9e9e9;
      color: #222;
      position:absolute;
      right: 10px;
      top: 48px;
    }
        #maybe{
      background: #e9e9e9;
      color: #222;
      position:absolute;
      left: 50%;
      top: 110px;
      transform: translateX(-50%);
      white-space: nowrap;
    }
.hint{ margin-top: 10px; font-size: 12px; color: rgba(0,0,0,0.45); }

    /* écran final */
    .result{
      display:none;
      margin-top: 10px;
    }
    .result h2{ margin: 6px 0 10px; }
    .result img,
    .result video{
      width: min(360px, 86vw);
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 14px 40px rgba(0,0,0,0.14);
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">💘</div>
    <h1>Joyeux anniversaire mi caracol, veux tu être ma valentine ?</h1>
    <p id="sub">Réponds honnêtement (mais choisis bien 😄).</p>

    <div class="btn-area" id="arena">
      <button id="yes">Oui</button>
      <button id="no" aria-label="Non">Non</button>
      <button id="maybe" aria-label="Je sais pas">Je sais pas</button>
    </div>

    <div class="hint" id="hint">Astuce : le “Non” et le “Je sais pas” sont… capricieux.</div>

    <div class="result" id="result">
      <h2>YAY! 🎉</h2>
      <video id="vid" src="Création_d_animation_GIF_Saint_Valentin_Vietnamienne.mp4" playsinline autoplay muted loop controls></video>
      <div class="hint">Si tu veux le son, enlève le mute via le bouton volume/lecture.</div>
    </div>
  </div>

  <script>
    // Personnalisation rapide
    // (Tout est déjà écrit en dur dans le HTML)

    const arena = document.getElementById("arena");
    const noBtn  = document.getElementById("no");
    const maybeBtn = document.getElementById("maybe");
    const yesBtn = document.getElementById("yes");
    const sub    = document.getElementById("sub");
    const result = document.getElementById("result");

    let tries = 0;

    function moveBtn(btn) {
      const pad = 10;

      const a = arena.getBoundingClientRect();
      const b = btn.getBoundingClientRect();

      const maxX = a.width  - b.width  - pad;
      const maxY = a.height - b.height - pad;

      const x = Math.max(pad, Math.floor(Math.random() * maxX));
      const y = Math.max(pad, Math.floor(Math.random() * maxY));

      // Si le bouton avait un transform en CSS (ex: centré), on l'annule avant de le déplacer
      btn.style.transform = "none";
      btn.style.left = x + "px";
      btn.style.top  = y + "px";
      btn.style.right = "auto";
    }

    function growYes() {
      const scale = 1 + Math.min(tries, 10) * 0.08; // plafonne pour éviter l’abus
      yesBtn.style.transform = `scale(${scale})`;
    }

    // Empêche le clic + effet "fuite" (Non + Je sais pas)
    function updateSubText() {
      if (tries === 2) sub.textContent = "Allez… réfléchis 😇";
      if (tries === 4) sub.textContent = "Tu peux cliquer sur “Oui” quand tu veux.";
      if (tries === 7) sub.textContent = "Ok, je rends le bouton “Oui” encore plus facile.";
    }

    function setupDodge(btn) {
      ["mouseenter","touchstart","pointerdown"].forEach(evt => {
        btn.addEventListener(evt, (e) => {
          e.preventDefault();
          tries++;
          moveBtn(btn);
          growYes();
          updateSubText();
        }, { passive: false });
      });
    }

    setupDodge(noBtn);
    setupDodge(maybeBtn);


    yesBtn.addEventListener("click", () => {
      // Cache les boutons, affiche le résultat
      arena.style.display = "none";
      document.getElementById("hint").style.display = "none";
      sub.textContent = "";
      result.style.display = "block";
      const vid = document.getElementById("vid");
      if (vid) { vid.currentTime = 0; vid.play().catch(()=>{}); }
    });

    // Place initiale du "Non" (utile si l’écran est petit)
    window.addEventListener("load", () => moveBtn(noBtn));
    window.addEventListener("resize", () => moveBtn(noBtn));
  </script>
</body>
</html>
