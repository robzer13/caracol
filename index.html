<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Question importante</title>
  <style>
    :root { --pink:#e91e63; --bg1:#ffd6e7; --bg2:#f7e8ff; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      padding: 20px;
    }
    .card{
      width:min(560px, 92vw);
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      text-align:center;
      position: relative;
    }
    .icon{
      width: 72px; height:72px; margin: 0 auto 10px;
      border-radius: 50%;
      display:grid; place-items:center;
      background: rgba(233,30,99,0.12);
      font-size: 34px;
    }
    h1{ font-size: 22px; margin: 8px 0 6px; font-weight: 750; }
    p{ margin: 0 0 12px; color: rgba(0,0,0,0.65); }

    .btn-area{
      position: relative;
      width: min(460px, 88vw);
      height: 160px;
      margin: 14px auto 0;
    }
    button{
      border:0; cursor:pointer;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
      transition: transform 120ms ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      position:absolute;
      top: 60px;
    }
    #yes{
      background: var(--pink);
      color:white;
      left: 10px;
      transform-origin: left center;
      padding: 16px 26px;
      font-size: 18px;
    }
    #no{
      background: #e9e9e9;
      color: #222;
      right: 10px;
    }
    #maybe{
      background: #f2f2f2;
      color:#222;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;
      padding: 12px 18px;
      font-size: 14px;
    }

    .hint{ margin-top: 10px; font-size: 12px; color: rgba(0,0,0,0.45); }

    .result{
      display:none;
      margin-top: 12px;
    }
    .result h2{ margin: 6px 0 10px; }
    video{
      width: min(520px, 92vw);
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 14px 40px rgba(0,0,0,0.14);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💘</div>
    <h1>Joyeux anniversaire mi caracol, veux tu être ma valentine ?</h1>
    <p id="sub">Réponds honnêtement (mais choisis bien).</p>

    <div class="btn-area" id="arena">
      <button id="yes">Oui</button>
      <button id="no" aria-label="Non">Non</button>
      <button id="maybe" aria-label="Je sais pas">Je sais pas</button>
    </div>

    <div class="hint" id="hint">Astuce : “Non” et “Je sais pas” sont… capricieux.</div>

    <div class="result" id="result">
      <h2>YAY! 🎉</h2>
      <video id="vid" playsinline autoplay muted loop controls></video>
      <div class="hint">Si tu veux le son : active le volume dans le lecteur.</div>
    </div>
  </div>

  <script>
    const arena = document.getElementById("arena");
    const noBtn  = document.getElementById("no");
    const maybeBtn = document.getElementById("maybe");
    const yesBtn = document.getElementById("yes");
    const sub    = document.getElementById("sub");
    const result = document.getElementById("result");
    const vid    = document.getElementById("vid");

    // Nom de fichier vidéo (ASCII recommandé pour éviter les soucis iPhone/URL)
    const VIDEO_FILE = "valentine.mp4";

    let tries = 0;

    function randomPos(btn){
      const pad = 10;
      const a = arena.getBoundingClientRect();
      const b = btn.getBoundingClientRect();
      const maxX = a.width  - b.width  - pad;
      const maxY = a.height - b.height - pad;

      const x = Math.max(pad, Math.floor(Math.random() * maxX));
      const y = Math.max(pad, Math.floor(Math.random() * maxY));

      btn.style.left = x + "px";
      btn.style.top  = y + "px";
      btn.style.right = "auto";
      btn.style.transform = "none";
    }

    function growYes() {
      const scale = 1 + Math.min(tries, 10) * 0.09;
      yesBtn.style.transform = `scale(${scale})`;
    }

    function evade(btn, e){
      if (e) e.preventDefault();
      tries++;
      randomPos(btn);
      growYes();
      if (tries === 2) sub.textContent = "Allez… réfléchis 😇";
      if (tries === 4) sub.textContent = "Objectivement, “Oui” est la meilleure réponse.";
      if (tries === 7) sub.textContent = "Ok, je rends le bouton Oui encore plus facile.";
    }

    ["mouseenter","mouseover","touchstart","pointerdown"].forEach(evt => {
      noBtn.addEventListener(evt, (e) => evade(noBtn, e), { passive:false });
      maybeBtn.addEventListener(evt, (e) => evade(maybeBtn, e), { passive:false });
    });

    // Au cas où un click passe
    noBtn.addEventListener("click", (e) => evade(noBtn, e));
    maybeBtn.addEventListener("click", (e) => evade(maybeBtn, e));

    yesBtn.addEventListener("click", () => {
      arena.style.display = "none";
      document.getElementById("hint").style.display = "none";
      sub.textContent = "";
      result.style.display = "block";

      // cache-bust + encodage safe
      const src = encodeURI(VIDEO_FILE) + "?v=" + Date.now();
      vid.src = src;
      // Force play (certaines plateformes bloquent si non muted)
      vid.play().catch(()=>{});
    });

    window.addEventListener("load", () => {
      randomPos(noBtn);
      randomPos(maybeBtn);
    });
    window.addEventListener("resize", () => {
      randomPos(noBtn);
      randomPos(maybeBtn);
    });
  </script>
</body>
</html>
